<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pop-up fixture</title>
<!-- A newsletter pop-up that covers the page shortly after load; capture must close it. -->
<style>
  body { margin: 0; font: 18px/1.5 system-ui, sans-serif; }
  section { min-height: 100vh; padding: 64px; }
  .popup { position: fixed; left: 0; right: 0; bottom: 0; height: 60vh; background: #e9d5ff; border-radius: 50% 50% 0 0; display: none; padding: 80px; text-align: center; }
</style>
</head>
<body>
  <section><h1>Shop the kit</h1><a href="#shop">Shop kits</a></section>
  <section><h2>How it works</h2></section>
  <div class="popup" id="news"><h2>Get customised content</h2><button>Sign up</button> <a href="#" onclick="document.getElementById('news').remove();return false">No Thanks →</a></div>
  <script>setTimeout(() => { document.getElementById('news').style.display = 'block'; }, 600);</script>
</body>
</html>
